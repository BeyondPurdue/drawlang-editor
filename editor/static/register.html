<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Request access — DrawLang Editor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { background: #f7f6f2; color: #28251d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin: 0; }
    .auth-wrap { max-width: 460px; margin: 6vh auto 0; padding: 32px 28px; background: #fff; border: 1px solid #d4d1ca; border-radius: 8px; }
    h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; }
    p.sub { margin: 0 0 20px; color: #7a7974; font-size: 14px; }
    label { display: block; font-size: 12px; color: #7a7974; margin: 12px 0 4px; }
    input[type=text], input[type=email], input[type=password], textarea {
      width: 100%; padding: 8px 10px; border: 1px solid #d4d1ca; border-radius: 4px;
      font-size: 14px; box-sizing: border-box; background: #fbfbf9; color: #28251d;
      font-family: inherit;
    }
    textarea { min-height: 80px; resize: vertical; }
    button.primary {
      margin-top: 20px; width: 100%; padding: 10px 12px; border: 0; border-radius: 4px;
      background: #01696f; color: #fbfbf9; font-size: 14px; font-weight: 500; cursor: pointer;
    }
    button.primary:hover { background: #0c4e54; }
    .msg { font-size: 13px; margin-top: 12px; min-height: 18px; }
    .err { color: #a12c7b; }
    .ok  { color: #437a22; }
    .foot { margin-top: 20px; text-align: center; font-size: 13px; color: #7a7974; }
    .foot a { color: #01696f; text-decoration: none; }
    .hint { font-size: 12px; color: #7a7974; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="auth-wrap">
    <h1>Request access</h1>
    <p class="sub">Accounts on trusted domains are approved automatically. Others require manual review.</p>
    <form id="regForm">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" required>

      <label for="display_name">Display name</label>
      <input type="text" id="display_name" name="display_name" autocomplete="name" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="new-password" required minlength="8">
      <div class="hint">At least 8 characters.</div>

      <label for="reason">Why do you want access? (optional)</label>
      <textarea id="reason" name="reason" placeholder="A short note helps me approve you faster."></textarea>

      <button type="submit" class="primary">Request account</button>
      <div class="msg" id="msg"></div>
    </form>
    <div class="foot">
      Already have an account? <a href="/login">Sign in</a>
    </div>
  </div>
  <script>
    const form = document.getElementById('regForm');
    const msg  = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'msg';
      msg.textContent = '';
      const body = {
        email: form.email.value.trim(),
        display_name: form.display_name.value.trim(),
        password: form.password.value,
        reason: form.reason.value.trim(),
      };
      try {
        const r = await fetch('/api/auth/register', {
          method: 'POST', credentials: 'same-origin',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify(body),
        });
        const j = await r.json().catch(() => ({}));
        if (!r.ok) {
          msg.classList.add('err');
          msg.textContent = j.detail || 'Registration failed';
          return;
        }
        msg.classList.add('ok');
        if (j.status === 'active') {
          msg.textContent = 'Account approved. Redirecting to sign in…';
          setTimeout(() => { location.href = '/login'; }, 900);
        } else {
          msg.textContent = 'Request received. You will receive an email when the admin approves it.';
          form.reset();
        }
      } catch (ex) {
        msg.classList.add('err');
        msg.textContent = 'Network error: ' + ex.message;
      }
    });
  </script>
</body>
</html>
