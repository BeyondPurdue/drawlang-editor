<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Users — DrawLang Editor Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body { background: #f7f6f2; color: #28251d; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; margin: 0; }
    .wrap { max-width: 1000px; margin: 24px auto; padding: 0 24px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
    header h1 { margin: 0; font-size: 20px; font-weight: 600; }
    header .who { font-size: 13px; color: #7a7974; }
    header .who a { color: #01696f; text-decoration: none; margin-left: 12px; }
    section { background: #fff; border: 1px solid #d4d1ca; border-radius: 8px; padding: 16px; margin-bottom: 20px; }
    section h2 { margin: 0 0 12px; font-size: 15px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #e7e5df; }
    th { font-weight: 500; color: #7a7974; }
    .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; }
    .pill.pending  { background: #fff4e0; color: #964219; }
    .pill.active   { background: #e6f2e3; color: #437a22; }
    .pill.disabled { background: #f3d5e3; color: #a12c7b; }
    .pill.demo  { background: #e6f0f2; color: #0c4e54; }
    .pill.admin { background: #ede4f7; color: #7a39bb; }
    .pill.user  { background: #f7f6f2; color: #7a7974; }
    .actions button { margin-right: 6px; font-size: 12px; padding: 4px 10px; border-radius: 4px; border: 1px solid #d4d1ca; background: #fbfbf9; cursor: pointer; }
    .actions button.approve { background: #01696f; color: #fff; border-color: #01696f; }
    .actions button.danger  { background: #fff; color: #a12c7b; border-color: #a12c7b; }
    .actions button:hover { opacity: .9; }
    .empty { color: #7a7974; font-style: italic; padding: 12px 0; }
    #toast { position: fixed; bottom: 20px; right: 20px; background: #28251d; color: #fbfbf9; padding: 10px 14px; border-radius: 6px; font-size: 13px; opacity: 0; transition: opacity .2s; }
    #toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Users</h1>
      <div class="who">
        <span id="who">…</span>
        <a href="/canvas-editor">Editor</a>
        <a href="/logout">Sign out</a>
      </div>
    </header>

    <section>
      <h2>Pending approval</h2>
      <div id="pending"></div>
    </section>

    <section>
      <h2>All users</h2>
      <div id="all"></div>
    </section>
  </div>
  <div id="toast"></div>
  <script>
    const $ = (id) => document.getElementById(id);
    const toast = (msg) => {
      const t = $('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 1800);
    };

    async function api(method, path, body) {
      const opts = { method, credentials: 'same-origin', headers: { 'content-type': 'application/json' } };
      if (body) opts.body = JSON.stringify(body);
      const r = await fetch(path, opts);
      if (!r.ok) {
        const j = await r.json().catch(() => ({}));
        throw new Error(j.detail || (method + ' ' + path + ' failed'));
      }
      return r.json();
    }

    function row(u, isPending) {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${u.email}</td>
        <td>${u.display_name || ''}</td>
        <td><span class="pill ${u.role}">${u.role}</span></td>
        <td><span class="pill ${u.status}">${u.status}</span></td>
        <td>${u.reason ? escapeHtml(u.reason) : ''}</td>
        <td>${u.created_at ? u.created_at.substring(0,10) : ''}</td>
        <td class="actions"></td>
      `;
      const actions = tr.querySelector('.actions');
      if (u.status === 'pending') {
        const b = document.createElement('button');
        b.textContent = 'Approve';
        b.className = 'approve';
        b.onclick = () => act('approve', u);
        actions.appendChild(b);
      }
      if (u.status !== 'disabled' && u.role !== 'admin' && u.role !== 'demo') {
        const b = document.createElement('button');
        b.textContent = 'Disable';
        b.className = 'danger';
        b.onclick = () => act('disable', u);
        actions.appendChild(b);
      }
      if (u.role !== 'admin' && u.role !== 'demo') {
        const b = document.createElement('button');
        b.textContent = 'Delete';
        b.className = 'danger';
        b.onclick = () => {
          if (confirm('Delete ' + u.email + ' and all their data?')) act('delete', u);
        };
        actions.appendChild(b);
      }
      return tr;
    }

    function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

    async function act(op, u) {
      try {
        await api('POST', `/api/admin/users/${u.id}/${op}`);
        toast(op + ' ' + u.email);
        load();
      } catch (e) { toast(e.message); }
    }

    async function load() {
      try {
        const me = await api('GET', '/api/auth/me');
        $('who').textContent = me.user.email + ' · admin';

        const pending = await api('GET', '/api/admin/users?status=pending');
        const all     = await api('GET', '/api/admin/users');

        const renderTable = (into, users) => {
          into.innerHTML = '';
          if (!users.users.length) {
            into.innerHTML = '<div class="empty">No users.</div>';
            return;
          }
          const t = document.createElement('table');
          t.innerHTML = `<thead><tr>
            <th>Email</th><th>Name</th><th>Role</th><th>Status</th><th>Reason</th><th>Created</th><th></th>
          </tr></thead>`;
          const tb = document.createElement('tbody');
          users.users.forEach(u => tb.appendChild(row(u)));
          t.appendChild(tb);
          into.appendChild(t);
        };

        renderTable($('pending'), pending);
        renderTable($('all'), all);
      } catch (e) {
        $('pending').innerHTML = '<div class="empty">Error: ' + escapeHtml(e.message) + '</div>';
      }
    }

    load();
  </script>
</body>
</html>
