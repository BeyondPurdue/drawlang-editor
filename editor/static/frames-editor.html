<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ES680 Frame Editor</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0; padding: 0;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  background: #F7F6F2; color: #28251D;
  display: flex; flex-direction: column; height: 100vh;
}
header {
  padding: 12px 20px; background: #fff; border-bottom: 1px solid #D4D1CA;
  display: flex; align-items: center; gap: 16px;
}
header h1 { margin: 0; font-size: 18px; font-weight: 600; }
header .status { font-size: 13px; color: #7A7974; }
header select, header button {
  padding: 6px 12px; border: 1px solid #D4D1CA; border-radius: 4px;
  background: #fff; font: inherit; cursor: pointer;
}
header button.primary { background: #01696F; color: #fff; border-color: #01696F; }
.main { flex: 1; display: flex; overflow: hidden; }
.sidebar {
  width: 340px; background: #FBFBF9; border-right: 1px solid #D4D1CA;
  overflow-y: auto; padding: 16px;
}
.sidebar h2 { margin: 0 0 12px; font-size: 14px; font-weight: 600; color: #7A7974; text-transform: uppercase; letter-spacing: 0.5px; }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: #7A7974; margin-bottom: 3px; }
.field input {
  width: 100%; padding: 6px 8px; border: 1px solid #D4D1CA; border-radius: 3px;
  font: inherit; background: #fff;
}
.field input:focus { outline: none; border-color: #01696F; box-shadow: 0 0 0 2px rgba(1,105,111,0.15); }
.field input.dirty { border-color: #DA7101; }
.preview {
  flex: 1; overflow: auto; padding: 20px; background: #ECEAE3;
  display: flex; align-items: flex-start; justify-content: center;
}
.preview svg {
  background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.08);
  max-width: 100%; height: auto;
}
.hotspot {
  cursor: text; fill: rgba(218, 113, 1, 0.06); stroke: rgba(218, 113, 1, 0.3);
  stroke-width: 1; stroke-dasharray: 3,3;
}
.hotspot:hover { fill: rgba(218, 113, 1, 0.15); stroke: rgba(218, 113, 1, 0.6); }
.hotspot.active { fill: rgba(1, 105, 111, 0.15); stroke: #01696F; stroke-dasharray: none; stroke-width: 1.5; }
.saving { opacity: 0.6; pointer-events: none; }
.error { color: #A12C7B; padding: 8px 12px; background: rgba(161,44,123,0.08); border-radius: 4px; margin: 8px 0; font-size: 13px; }
</style>
</head>
<body>
<header>
  <h1>ES680 Frame Editor</h1>
  <select id="frame-select"></select>
  <button id="reset-btn">Reset values</button>
  <button id="export-svg" class="primary">Export SVG</button>
  <span class="status" id="status">Loading…</span>
</header>
<div class="main">
  <aside class="sidebar">
    <h2>Title-block fields</h2>
    <div id="fields"></div>
    <div id="error"></div>
  </aside>
  <div class="preview" id="preview">
    <div style="color:#7A7974">Loading frame…</div>
  </div>
</div>

<script src="/static/frames-editor.js"></script>
</body>
</html>
